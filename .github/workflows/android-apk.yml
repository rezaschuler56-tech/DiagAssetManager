name: Build Off-Road Android APK

on:
  push:
    branches:
      - offroad-smart-control-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Off-Road source
        shell: bash
        run: |
          rm -rf offroad-smart-control-v0.1
          unzip -q offroad-smart-control-v0.1-source.zip
          test -f offroad-smart-control-v0.1/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: offroad-smart-control-v0.1
        run: gradle --stacktrace :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp offroad-smart-control-v0.1/app/build/outputs/apk/debug/app-debug.apk apk-output/OffRoad-Smart-Control-v0.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offroad-smart-control-v0.1-apk
          path: apk-output/OffRoad-Smart-Control-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
