name: Build Off-Road Android APK

on:
  push:
    branches:
      - offroad-smart-control-v0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          rm -rf offroad-app
          mkdir -p offroad-app/app/src/main/java/com/offroad/smartcontrol
          mkdir -p offroad-app/app/src/main/res/values

          cat > offroad-app/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > offroad-app/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OffRoadSmartControl"
          include(":app")
          EOF

          cat > offroad-app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > offroad-app/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.offroad.smartcontrol"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.offroad.smartcontrol"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > offroad-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/Theme.OffRoad"
                  android:label="Off-Road Smart Control"
                  android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > offroad-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.OffRoad" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#101412</item>
                  <item name="android:navigationBarColor">#101412</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > offroad-app/app/src/main/java/com/offroad/smartcontrol/MainActivity.kt <<'EOF'
          package com.offroad.smartcontrol

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { OffRoadApp() }
              }
          }

          @Composable
          fun OffRoadApp() {
              var pitch by remember { mutableFloatStateOf(12f) }
              var roll by remember { mutableFloatStateOf(-6f) }
              var water by remember { mutableIntStateOf(67) }
              var light by remember { mutableStateOf(false) }
              var roof by remember { mutableStateOf(false) }
              var shower by remember { mutableStateOf(false) }
              var fridge by remember { mutableStateOf(true) }
              var fault by remember { mutableStateOf("بدون خطا") }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Color(0xFFFFB300),
                      secondary = Color(0xFF54D17A),
                      background = Color(0xFF101412),
                      surface = Color(0xFF19201D)
                  )
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(MaterialTheme.colorScheme.background)
                          .verticalScroll(rememberScrollState())
                          .padding(18.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      Text("OFF-ROAD SMART CONTROL", fontSize = 24.sp, fontWeight = FontWeight.Bold)
                      Text("SIMULATION MODE • V0.1", color = MaterialTheme.colorScheme.secondary)

                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          InfoCard("PITCH", "${pitch.toInt()}°", Modifier.weight(1f))
                          InfoCard("ROLL", "${roll.toInt()}°", Modifier.weight(1f))
                          InfoCard("BATTERY", "13.8 V", Modifier.weight(1f))
                      }

                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                          InfoCard("ALTITUDE", "1835 m", Modifier.weight(1f))
                          InfoCard("SPEED", "24 km/h", Modifier.weight(1f))
                          InfoCard("WATER", "$water%", Modifier.weight(1f))
                      }

                      Text("کنترل تجهیزات", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      ControlRow("لایت بار جلو", light) { light = it }
                      ControlRow("چراغ سقف", roof) { roof = it }
                      ControlRow("پمپ دوش آب", shower) { shower = it }
                      ControlRow("یخچال", fridge) { fridge = it }

                      HorizontalDivider()
                      Text("شبیه‌ساز مهندسی", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Text("Pitch: ${pitch.toInt()}°")
                      Slider(value = pitch, onValueChange = { pitch = it }, valueRange = -40f..40f)
                      Text("Roll: ${roll.toInt()}°")
                      Slider(value = roll, onValueChange = { roll = it }, valueRange = -40f..40f)
                      Text("Water: $water%")
                      Slider(value = water.toFloat(), onValueChange = { water = it.toInt() }, valueRange = 0f..100f)

                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Button(onClick = { fault = "RR LOW PRESSURE • 22 PSI" }) { Text("TPMS Fault") }
                          Button(onClick = { fault = "OUT1 SHORT CIRCUIT" }) { Text("Short Circuit") }
                      }
                      Button(onClick = { fault = "بدون خطا" }) { Text("Clear Faults") }
                      Text("STATUS: $fault", color = if (fault == "بدون خطا") MaterialTheme.colorScheme.secondary else Color(0xFFFF6B6B), fontWeight = FontWeight.Bold)

                      Text("TPMS: FL 32 • FR 31 • RL 29 • RR 30 PSI")
                      Text("Track Logger: 12.7 km • Heading 287° NW")
                      Text("این نسخه بدون سخت‌افزار و فقط با Digital Twin کار می‌کند.")
                  }
              }
          }

          @Composable
          fun InfoCard(title: String, value: String, modifier: Modifier = Modifier) {
              Card(modifier) {
                  Column(Modifier.padding(12.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(title, fontSize = 11.sp, color = Color(0xFFADB5B0))
                      Text(value, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun ControlRow(label: String, checked: Boolean, onChange: (Boolean) -> Unit) {
              Card(Modifier.fillMaxWidth()) {
                  Row(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                      Text(label, Modifier.weight(1f), fontSize = 17.sp)
                      Switch(checked = checked, onCheckedChange = onChange)
                  }
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: offroad-app
        run: gradle --stacktrace :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp offroad-app/app/build/outputs/apk/debug/app-debug.apk apk-output/OffRoad-Smart-Control-v0.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offroad-smart-control-v0.1-apk
          path: apk-output/OffRoad-Smart-Control-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
