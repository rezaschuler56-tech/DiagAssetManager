name: Package Firebird 2.5
on:
  push:
    branches:
      - temp/firebird25-extractor
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Download Firebird 2.5
        run: |
          mkdir -p out
          curl -L -o fb.tar.gz https://github.com/FirebirdSQL/firebird/releases/download/R2_5_9/FirebirdCS-2.5.9.27139-0.amd64.tar.gz
          tar -xzf fb.tar.gz
          find . -name buildroot.tar.gz -exec tar -xzf {} -C out \;
          cp -a out/opt/firebird package
          tar -czf firebird25-portable.tar.gz package
      - uses: actions/upload-artifact@v4
        with:
          name: firebird25-portable
          path: firebird25-portable.tar.gz
          retention-days: 1
